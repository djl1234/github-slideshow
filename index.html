<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cattle Feed Lot Monitor</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <div class="header-left">
            <h1>Cattle Feed Lot Monitor</h1>
            <span class="subtitle">10 Lots &middot; 5,000 Head Capacity</span>
        </div>
        <div class="header-right">
            <button id="btn-alerts" class="btn btn-icon" title="Alerts">
                <span class="icon">&#128276;</span>
                <span id="alert-badge" class="badge hidden">0</span>
            </button>
            <button id="btn-add-cattle" class="btn btn-primary">+ Add Cattle</button>
        </div>
    </header>

    <nav id="main-nav">
        <button class="nav-tab active" data-view="dashboard">Dashboard</button>
        <button class="nav-tab" data-view="lotsheet">Lot Sheet</button>
        <button class="nav-tab" data-view="lots">Lot Details</button>
        <button class="nav-tab" data-view="cattle">All Cattle</button>
        <button class="nav-tab" data-view="alerts">Alerts</button>
        <button class="nav-tab" data-view="reports">Reports</button>
    </nav>

    <!-- Dashboard View -->
    <main id="view-dashboard" class="view active">
        <div class="summary-cards" id="summary-cards"></div>
        <div class="lots-grid" id="lots-grid"></div>
    </main>

    <!-- Lot Sheet View -->
    <main id="view-lotsheet" class="view view-wide">
        <div class="toolbar">
            <input type="text" id="lotsheet-search" placeholder="Search by lot, pen, customer...">
            <select id="lotsheet-sex-filter">
                <option value="all">All Sex</option>
                <option value="O">Steers (O)</option>
                <option value="H">Heifers (H)</option>
            </select>
            <select id="lotsheet-prog-filter">
                <option value="all">All Programs</option>
                <option value="HOL">HOL</option>
                <option value="DEF">DEF</option>
            </select>
            <button id="btn-add-pen" class="btn btn-primary">+ Add Lot</button>
        </div>
        <div id="lotsheet-table-container" class="lotsheet-scroll-container"></div>
    </main>

    <!-- Lot Details View -->
    <main id="view-lots" class="view">
        <div class="lot-selector">
            <label for="lot-select">Select Lot:</label>
            <select id="lot-select"></select>
        </div>
        <div id="lot-detail-content"></div>
    </main>

    <!-- All Cattle View -->
    <main id="view-cattle" class="view">
        <div class="toolbar">
            <input type="text" id="cattle-search" placeholder="Search by tag, breed, or lot...">
            <select id="cattle-status-filter">
                <option value="all">All Statuses</option>
                <option value="active">Active</option>
                <option value="processing">Processing</option>
                <option value="deceased">Deceased</option>
                <option value="medical">Medical Care</option>
                <option value="pregnant">Pregnant</option>
            </select>
            <select id="cattle-lot-filter">
                <option value="all">All Lots</option>
            </select>
        </div>
        <div id="cattle-table-container"></div>
    </main>

    <!-- Alerts View -->
    <main id="view-alerts" class="view">
        <div class="toolbar">
            <button id="btn-mark-all-read" class="btn btn-secondary">Mark All Read</button>
            <button id="btn-clear-alerts" class="btn btn-secondary">Clear All</button>
        </div>
        <div id="alerts-list"></div>
    </main>

    <!-- Reports View -->
    <main id="view-reports" class="view">
        <div class="report-section">
            <h2>Lot Capacity Summary</h2>
            <table id="capacity-report" class="report-table"></table>
        </div>
        <div class="report-section">
            <h2>Status Breakdown</h2>
            <table id="status-report" class="report-table"></table>
        </div>
        <div class="report-section">
            <h2>Days on Feed Distribution</h2>
            <table id="dof-report" class="report-table"></table>
        </div>
    </main>

    <!-- Add/Edit Cattle Modal -->
    <div id="modal-cattle" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-cattle-title">Add Cattle</h2>
                <button class="modal-close">&times;</button>
            </div>
            <form id="form-cattle">
                <div class="form-row">
                    <div class="form-group">
                        <label for="cattle-tag">Tag Number *</label>
                        <input type="text" id="cattle-tag" required>
                    </div>
                    <div class="form-group">
                        <label for="cattle-lot">Lot *</label>
                        <select id="cattle-lot" required></select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="cattle-breed">Breed</label>
                        <input type="text" id="cattle-breed" placeholder="e.g. Angus, Hereford">
                    </div>
                    <div class="form-group">
                        <label for="cattle-weight">Weight (lbs)</label>
                        <input type="number" id="cattle-weight" min="0" step="1">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="cattle-date-added">Date On Feed *</label>
                        <input type="date" id="cattle-date-added" required>
                    </div>
                    <div class="form-group">
                        <label for="cattle-status">Status</label>
                        <select id="cattle-status">
                            <option value="active">Active</option>
                            <option value="medical">Medical Care</option>
                            <option value="pregnant">Pregnant</option>
                            <option value="processing">Processing</option>
                            <option value="deceased">Deceased</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="cattle-notes">Notes</label>
                    <textarea id="cattle-notes" rows="3"></textarea>
                </div>
                <input type="hidden" id="cattle-id">
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary modal-cancel">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Change Status Modal -->
    <div id="modal-status" class="modal hidden">
        <div class="modal-content modal-sm">
            <div class="modal-header">
                <h2>Change Status</h2>
                <button class="modal-close">&times;</button>
            </div>
            <form id="form-status">
                <p id="status-cattle-info"></p>
                <div class="form-group">
                    <label for="new-status">New Status</label>
                    <select id="new-status" required>
                        <option value="active">Active</option>
                        <option value="medical">Medical Care</option>
                        <option value="pregnant">Pregnant</option>
                        <option value="processing">Moved to Processing</option>
                        <option value="deceased">Deceased</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="status-notes">Reason / Notes</label>
                    <textarea id="status-notes" rows="2"></textarea>
                </div>
                <input type="hidden" id="status-cattle-id">
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary modal-cancel">Cancel</button>
                    <button type="submit" class="btn btn-primary">Update Status</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Move Cattle Modal -->
    <div id="modal-move" class="modal hidden">
        <div class="modal-content modal-sm">
            <div class="modal-header">
                <h2>Move Cattle to Another Lot</h2>
                <button class="modal-close">&times;</button>
            </div>
            <form id="form-move">
                <p id="move-cattle-info"></p>
                <div class="form-group">
                    <label for="move-target-lot">Move to Lot</label>
                    <select id="move-target-lot" required></select>
                </div>
                <input type="hidden" id="move-cattle-id">
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary modal-cancel">Cancel</button>
                    <button type="submit" class="btn btn-primary">Move</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Add/Edit Pen Modal -->
    <div id="modal-pen" class="modal hidden">
        <div class="modal-content modal-lg">
            <div class="modal-header">
                <h2 id="modal-pen-title">Add Lot</h2>
                <button class="modal-close">&times;</button>
            </div>
            <form id="form-pen">
                <div class="form-row form-row-3">
                    <div class="form-group">
                        <label for="pen-trl">Trl</label>
                        <select id="pen-trl">
                            <option value="Ultra">Ultra</option>
                            <option value="HR">HR</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="pen-srt">Srt</label>
                        <select id="pen-srt">
                            <option value="Strt">Strt</option>
                            <option value="Lot">Lot</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="pen-prog">Prog</label>
                        <select id="pen-prog">
                            <option value="HOL">HOL</option>
                            <option value="DEF">DEF</option>
                        </select>
                    </div>
                </div>
                <div class="form-row form-row-3">
                    <div class="form-group">
                        <label for="pen-lotnum">Lot # *</label>
                        <input type="number" id="pen-lotnum" required>
                    </div>
                    <div class="form-group">
                        <label for="pen-pen">Pen *</label>
                        <input type="text" id="pen-pen" required placeholder="e.g. B25">
                    </div>
                    <div class="form-group">
                        <label for="pen-sex">Sx</label>
                        <select id="pen-sex">
                            <option value="O">O (Steer)</option>
                            <option value="H">H (Heifer)</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="pen-sfperhd">Sf/Hd</label>
                        <input type="number" id="pen-sfperhd" step="1">
                    </div>
                    <div class="form-group">
                        <label for="pen-bunkinperhd">Bunk In/Hd</label>
                        <input type="number" id="pen-bunkinperhd" step="0.1">
                    </div>
                </div>
                <div class="form-row form-row-3">
                    <div class="form-group">
                        <label for="pen-avgwt">Avg Wt</label>
                        <input type="number" id="pen-avgwt" step="1">
                    </div>
                    <div class="form-group">
                        <label for="pen-ewt">EWT</label>
                        <input type="number" id="pen-ewt" step="1">
                    </div>
                    <div class="form-group">
                        <label for="pen-orighdin">Orig Hd In</label>
                        <input type="number" id="pen-orighdin" step="1">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="pen-datein">Date In *</label>
                        <input type="text" id="pen-datein" required placeholder="M/D/YYYY">
                    </div>
                    <div class="form-group">
                        <label for="pen-dateout">Date Out</label>
                        <input type="text" id="pen-dateout" placeholder="M/D/YYYY">
                    </div>
                </div>
                <div class="form-row form-row-5">
                    <div class="form-group">
                        <label for="pen-loclot">Loc Lot</label>
                        <input type="number" id="pen-loclot" step="1">
                    </div>
                    <div class="form-group">
                        <label for="pen-locpen">Loc Pen</label>
                        <input type="number" id="pen-locpen" step="1">
                    </div>
                    <div class="form-group">
                        <label for="pen-loch">Loc H</label>
                        <input type="number" id="pen-loch" step="1" value="0">
                    </div>
                    <div class="form-group">
                        <label for="pen-locb">Loc B</label>
                        <input type="number" id="pen-locb" step="1" value="0">
                    </div>
                    <div class="form-group">
                        <label for="pen-locr">Loc R</label>
                        <input type="number" id="pen-locr" step="1" value="0">
                    </div>
                </div>
                <div class="form-row form-row-3">
                    <div class="form-group">
                        <label for="pen-sold">Sold</label>
                        <input type="number" id="pen-sold" step="1" value="0">
                    </div>
                    <div class="form-group">
                        <label for="pen-deadsno">Deads No</label>
                        <input type="number" id="pen-deadsno" step="1" value="0">
                    </div>
                    <div class="form-group">
                        <label for="pen-deadspct">Deads %</label>
                        <input type="number" id="pen-deadspct" step="0.01" value="0">
                    </div>
                </div>
                <div class="form-row form-row-3">
                    <div class="form-group">
                        <label for="pen-consneg1">Cons -1</label>
                        <input type="number" id="pen-consneg1" step="0.1">
                    </div>
                    <div class="form-group">
                        <label for="pen-cons7d">Cons 7d</label>
                        <input type="number" id="pen-cons7d" step="0.1">
                    </div>
                    <div class="form-group">
                        <label for="pen-consytd">Cons YTD</label>
                        <input type="number" id="pen-consytd" step="0.1">
                    </div>
                </div>
                <div class="form-row form-row-3">
                    <div class="form-group">
                        <label for="pen-curchgs">Cur Chgs ($)</label>
                        <input type="number" id="pen-curchgs" step="0.01">
                    </div>
                    <div class="form-group">
                        <label for="pen-ytdchgs">YTD Chgs ($)</label>
                        <input type="number" id="pen-ytdchgs" step="0.01">
                    </div>
                    <div class="form-group">
                        <label for="pen-customer">Customer</label>
                        <input type="text" id="pen-customer" placeholder="e.g. ARCADIA CO">
                    </div>
                </div>
                <input type="hidden" id="pen-id">
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary modal-cancel">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast container for notifications -->
    <div id="toast-container"></div>

    <script src="js/store.js"></script>
    <script src="js/alerts.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
